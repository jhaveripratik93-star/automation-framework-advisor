framework_name: "Ansible"
vendor: "Red Hat (IBM)"
license: "GPL-3.0"
website: "https://www.ansible.com"
first_release: "2012"
latest_version: "2.17+ (core) / 10+ (package)"
category: "cloud_infrastructure"
languages_supported:
  - "YAML (playbooks)"
  - "Python (modules, plugins, custom logic)"
  - "Jinja2 (templating)"

architecture_fit:
  web_spa: false
  web_mpa: false
  native_mobile: false
  hybrid_mobile: false
  desktop: false
  api_testing: false
  microservices: false
  cloud_infrastructure: true
  infrastructure_as_code: true
  configuration_management: true
  multi_cloud: true
  hybrid_cloud: true
  on_premise: true

capabilities:
  shadow_dom: false
  iframe_cross_origin: false
  multi_tab: false
  multi_domain: false
  canvas_webgl: false
  file_upload_download: false
  network_interception: false
  visual_regression: false
  parallel_execution: "native (forks, async)"
  auto_wait: "partial (wait_for module)"
  test_recorder: false
  code_generation: false
  component_testing: "molecule (role testing)"
  accessibility_testing: false
  agentless: true
  idempotent: true
  configuration_management: true
  orchestration: true
  provisioning: true
  application_deployment: true
  collections_ecosystem: "1500+ collections on Galaxy"
  vault_integration: "ansible-vault (built-in secrets)"

cloud_providers:
  aws: "amazon.aws collection"
  azure: "azure.azcollection"
  gcp: "google.cloud collection"
  oracle_cloud: "oracle.oci collection"
  vmware: "community.vmware collection"
  kubernetes: "kubernetes.core collection"
  openstack: "openstack.cloud collection"
  digital_ocean: "community.digitalocean"

testing_capabilities:
  unit_testing: "molecule (role unit tests)"
  integration_testing: "molecule + testinfra/ansible-assert"
  compliance_testing: "ansible-lint, custom assert tasks"
  idempotency_testing: "molecule idempotence check"
  dry_run: "ansible-playbook --check --diff"
  syntax_validation: "ansible-playbook --syntax-check"
  contract_testing: "argument_specs validation"

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: true
  ansible_tower: true
  awx: true

cloud_grids:
  ansible_automation_platform: true
  awx: true
  semaphore: true

performance:
  avg_test_execution_speed: "moderate (SSH-based execution)"
  resource_footprint: "low (agentless, control node only)"
  startup_time_ms: 1000
  parallel_overhead: "configurable (forks parameter)"
  connection_methods: "SSH, WinRM, local, Docker"

maintainability:
  page_object_support: false
  fixture_support: "roles, includes, imports"
  reusable_components: "roles and collections"
  built_in_reporting: "callback plugins (JSON, JUnit)"
  trace_viewer: false
  debugging_tools: "verbosity levels (-v to -vvvv), debugger strategy"
  role_versioning: true
  galaxy_registry: true

cloud_migration_metrics:
  configuration_coverage: "% of servers/services managed by playbooks"
  configuration_drift: "Hosts deviating from desired state"
  deployment_frequency: "Playbook runs per day/week"
  mean_time_to_recovery: "Time to re-run playbook after failure"
  change_failure_rate: "% of playbook runs with failures"
  compliance_score: "% of hosts passing ansible-lint checks"
  idempotency_rate: "% of tasks reporting 'ok' on re-run"
  inventory_accuracy: "Dynamic inventory freshness"

pip_packages:
  ansible: ">=9.0"
  ansible-lint: ">=6.0"
install_commands: []
test_command: "ansible-playbook playbook.yml --check"
report_paths:
  - "ansible-results/"

limitations:
  - "NOT a test automation framework for applications"
  - "YAML syntax can be error-prone and hard to debug"
  - "No true state management (desired-state, not tracked state)"
  - "Complex variable precedence (22 levels)"
  - "Limited Windows support compared to Linux"
  - "Performance degrades with large inventories"
  - "No native drift detection (requires scheduled runs)"
  - "GPL-3.0 license may restrict some enterprise usage"
  - "Cannot test application behavior, only configuration/deployment"

versions:
  - version: "2.17"
    release_date: "2024-05-20"
    min_runtime: "Python 3.10+"
    notable_features:
      - "Python 3.12 support"
      - "Improved ansible-lint integration"
      - "Better error messages"
    capabilities_added:
      - name: "python312_support"
        status: "added"
        description: "Full Python 3.12 compatibility"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "Some older community collections may not support Python 3.12"

  - version: "2.14"
    release_date: "2023-05-16"
    min_runtime: "Python 3.9+"
    notable_features:
      - "ansible-core and ansible package split"
      - "Improved collection dependency resolution"
    capabilities_added:
      - name: "collection_dependency_resolution"
        status: "improved"
        description: "Better galaxy dependency resolution for complex collection graphs"
    capabilities_deprecated:
      - name: "python38_support"
        status: "removed"
        description: "Python 3.8 no longer supported"
        replacement: "Python 3.9+"
    breaking_changes:
      - description: "Python 3.8 dropped — minimum is 3.9"
        migration_effort: "low"
        affected_apis: []
        workaround: "Upgrade Python to 3.9+"
    known_limitations:
      - "Large inventories still slow with SSH transport"

  - version: "2.9"
    release_date: "2021-10-13"
    min_runtime: "Python 3.8+"
    notable_features:
      - "ansible-core 2.12 based"
      - "Collections as first-class"
      - "Jinja2 improvements"
    capabilities_added:
      - name: "collections_first_class"
        status: "improved"
        description: "Collections fully replace role-based distribution"
    capabilities_deprecated:
      - name: "classic_modules"
        status: "deprecated"
        description: "Many modules moved from ansible-base to collections"
        replacement: "Install collections separately: ansible-galaxy collection install"
    breaking_changes:
      - description: "Modules moved to collections — bare module names require FQCN"
        migration_effort: "high"
        affected_apis: ["yum", "apt", "copy", "template", "service"]
        workaround: "Use FQCN: ansible.builtin.yum, ansible.builtin.copy, etc."
    known_limitations:
      - "FQCN makes playbooks more verbose"

  - version: "2.0"
    release_date: "2019-11-06"
    eol_date: "2022-05-01"
    min_runtime: "Python 2.7+ / Python 3.5+"
    notable_features:
      - "Last version before ansible-core split"
      - "All modules bundled in single package"
    capabilities_added: []
    capabilities_deprecated:
      - name: "python27"
        status: "deprecated"
        description: "Python 2.7 support deprecated"
        replacement: "Python 3.8+"
    breaking_changes: []
    known_limitations:
      - "Monolithic package — large install size"
      - "No collection isolation"
