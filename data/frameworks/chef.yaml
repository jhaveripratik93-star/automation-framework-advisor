framework_name: "Chef"
vendor: "Progress Software"
license: "Apache-2.0"
website: "https://www.chef.io"
first_release: "2009"
latest_version: "18.x (Infra Client)"
category: "cloud_infrastructure"
languages_supported:
  - "Ruby (cookbooks/recipes)"
  - "InSpec DSL (compliance testing)"
  - "Habitat (application packaging)"

architecture_fit:
  web_spa: false
  web_mpa: false
  native_mobile: false
  hybrid_mobile: false
  desktop: false
  api_testing: false
  microservices: false
  cloud_infrastructure: true
  infrastructure_as_code: true
  configuration_management: true
  multi_cloud: true
  hybrid_cloud: true
  on_premise: true
  compliance_automation: true

capabilities:
  shadow_dom: false
  iframe_cross_origin: false
  multi_tab: false
  multi_domain: false
  canvas_webgl: false
  file_upload_download: false
  network_interception: false
  visual_regression: false
  parallel_execution: "native (client runs, parallel convergence)"
  auto_wait: false
  test_recorder: false
  code_generation: "chef generate (scaffolding)"
  component_testing: "ChefSpec (unit), Test Kitchen (integration)"
  accessibility_testing: false
  agent_based: true
  idempotent: true
  configuration_management: true
  compliance_as_code: "Chef InSpec"
  application_packaging: "Chef Habitat"
  node_management: true
  cookbook_versioning: true
  supermarket_ecosystem: "community cookbooks"

cloud_providers:
  aws: "aws cookbook, knife-ec2"
  azure: "azure cookbook, knife-azure"
  gcp: "google-cloud cookbook"
  vmware: "knife-vsphere"
  oracle_cloud: "community cookbooks"
  kubernetes: "via Habitat"
  openstack: "openstack cookbook"

testing_capabilities:
  unit_testing: "ChefSpec (RSpec-based, fast, no convergence)"
  integration_testing: "Test Kitchen (multi-platform, real convergence)"
  compliance_testing: "Chef InSpec (200+ built-in resources)"
  idempotency_testing: "Test Kitchen converge x2 check"
  linting: "Cookstyle (RuboCop-based)"
  contract_testing: "custom resource property validation"
  audit_mode: "Chef Infra audit mode"

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: true
  chef_automate: true

cloud_grids:
  chef_automate: true
  chef_manage: true
  hosted_chef: true

performance:
  avg_test_execution_speed: "moderate (convergence-based)"
  resource_footprint: "medium (agent on each node)"
  startup_time_ms: 2000
  parallel_overhead: "low (each node converges independently)"
  convergence_interval: "configurable (default 30 min)"

maintainability:
  page_object_support: false
  fixture_support: "cookbooks, roles, environments"
  reusable_components: "cookbooks (versioned) + Policyfiles"
  built_in_reporting: "Chef Automate dashboards"
  trace_viewer: false
  debugging_tools: "chef-shell, why-run mode, -l debug"
  cookbook_versioning: true
  supermarket_registry: true

cloud_migration_metrics:
  node_coverage: "% of nodes managed by Chef"
  convergence_success_rate: "% of successful chef-client runs"
  configuration_drift: "Nodes deviating (detected by InSpec)"
  compliance_score: "InSpec profile pass rate"
  deployment_frequency: "Cookbook version promotions per week"
  mean_time_to_recovery: "Time to re-converge after failure"
  change_failure_rate: "% of cookbook changes causing failures"
  audit_coverage: "% of CIS/SOC2 controls automated"
  resource_coverage: "% of infrastructure resources in cookbooks"

pip_packages: {}
install_commands: []
test_command: "kitchen test"
report_paths:
  - "kitchen-results/"

limitations:
  - "NOT a test automation framework for applications"
  - "Agent-based architecture (requires client on every node)"
  - "Chef Server adds operational complexity"
  - "Smaller community than Ansible/Terraform"
  - "Heavier setup compared to Ansible (agentless)"
  - "Cookbook dependency management can be complex"
  - "Progress Software acquisition raised long-term concerns"
  - "Higher operational overhead for small teams"
  - "Not suitable for immutable infrastructure patterns"
  - "Cannot test application behavior, only server configuration"

versions:
  - version: "18.0"
    release_date: "2023-10-25"
    min_runtime: "Ruby 3.1+"
    notable_features:
      - "Ruby 3.1+ required"
      - "Compliance phase improvements"
      - "Target mode enhancements"
    capabilities_added:
      - name: "target_mode_enhanced"
        status: "improved"
        description: "Better agentless (target mode) execution for cloud resources"
    capabilities_deprecated:
      - name: "ruby27_support"
        status: "removed"
        description: "Ruby 2.7 no longer supported"
        replacement: "Ruby 3.1+"
    breaking_changes:
      - description: "Ruby 3.1 minimum required"
        migration_effort: "medium"
        affected_apis: []
        workaround: "Upgrade Ruby on all nodes and workstations"
    known_limitations:
      - "Some community cookbooks may need updates for Ruby 3.1"

  - version: "17.0"
    release_date: "2022-04-01"
    min_runtime: "Ruby 2.7+"
    notable_features:
      - "Chef Infra unified agent"
      - "Compliance phase (InSpec embedded)"
      - "Improved FIPS support"
    capabilities_added:
      - name: "compliance_phase"
        status: "added"
        description: "Run InSpec profiles directly within chef-client run"
      - name: "unified_agent"
        status: "improved"
        description: "Single package includes Infra, InSpec, and Habitat"
    capabilities_deprecated:
      - name: "legacy_mixins"
        status: "deprecated"
        description: "Legacy Chef::Mixin classes deprecated"
        replacement: "Use Chef::DSL:: modules"
    breaking_changes: []
    known_limitations:
      - "Unified package is larger"

  - version: "16.0"
    release_date: "2020-04-02"
    eol_date: "2023-01-01"
    min_runtime: "Ruby 2.6+"
    notable_features:
      - "Chef Infra branding (replaces Chef Client)"
      - "Policyfile as default workflow"
      - "YAML recipe support (experimental)"
    capabilities_added:
      - name: "policyfile_default"
        status: "improved"
        description: "Policyfile recommended over roles/environments"
      - name: "yaml_recipes"
        status: "added"
        description: "Experimental YAML recipe format"
    capabilities_deprecated:
      - name: "roles_environments"
        status: "deprecated"
        description: "Roles and environments workflow deprecated"
        replacement: "Policyfiles"
    breaking_changes:
      - description: "Many legacy resource properties removed"
        migration_effort: "medium"
        affected_apis: ["supports property on service", "provider property"]
        workaround: "Use modern resource syntax — see Chef migration docs"
    known_limitations:
      - "YAML recipes are experimental"
      - "Policyfile migration from roles/environments is non-trivial"

  - version: "14.0"
    release_date: "2018-04-01"
    eol_date: "2021-05-01"
    min_runtime: "Ruby 2.5+"
    notable_features:
      - "Custom resource improvements"
      - "Ohai 14 (system profiling)"
    capabilities_added:
      - name: "custom_resources_improved"
        status: "improved"
        description: "Simplified custom resource authoring"
    capabilities_deprecated:
      - name: "chef_12_compat"
        status: "removed"
        description: "Chef 12 backward compatibility code removed"
        replacement: "Update cookbooks to Chef 14+ syntax"
    breaking_changes:
      - description: "Chef 12 compatibility mode removed"
        migration_effort: "high"
        affected_apis: ["Chef 12 resource cloning", "run_context compat"]
        workaround: "Update all cookbooks to modern Chef resource syntax"
    known_limitations:
      - "Must update all community cookbooks to 14+ compatible versions"
