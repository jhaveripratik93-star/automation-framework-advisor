framework_name: "Puppeteer"
vendor: "Google"
license: "Apache-2.0"
website: "https://pptr.dev"
first_release: "2017"
latest_version: "22.x"
category: "test_automation"
languages_supported:
  - JavaScript
  - TypeScript

architecture_fit:
  web_spa: true
  web_mpa: true
  native_mobile: false
  hybrid_mobile: false
  desktop: false
  api_testing: "indirect (via page.evaluate)"
  microservices: false
  performance_testing: false
  load_testing: false
  cloud_infrastructure: false
  infrastructure_as_code: false
  multi_cloud: false
  hybrid_cloud: false

capabilities:
  shadow_dom: true
  iframe_cross_origin: true
  multi_tab: true
  multi_domain: true
  canvas_webgl: "screenshot-based"
  file_upload_download: true
  network_interception: true
  visual_regression: "third-party (pixelmatch)"
  parallel_execution: "manual (multiple browser instances)"
  auto_wait: "partial (waitForSelector)"
  test_recorder: "Chrome DevTools Recorder"
  code_generation: "Chrome DevTools export"
  component_testing: false
  accessibility_testing: "via @axe-core/puppeteer"
  gesture_support: false
  device_farm_support: false
  protocol_support: ["HTTP/HTTPS"]
  schema_validation: false
  json_path_support: false
  xml_path_support: false
  drift_detection: false
  state_management: false
  plan_and_apply: false
  policy_as_code: false

cloud_providers:
  aws: false
  azure: false
  gcp: false
  kubernetes: false

testing_capabilities:
  unit_testing: false
  integration_testing: false
  e2e_testing: true
  component_testing: false
  visual_testing: "third-party"
  accessibility_testing: "plugin"
  api_testing: "indirect"
  performance_testing: false

cloud_migration_metrics:
  not_applicable: true

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: true
  terraform_cloud: false
  atlantis: false
  aws_codepipeline: false
  aws_codebuild: false

cloud_grids:
  browserstack: "limited"
  sauce_labs: "limited"

performance:
  avg_test_execution_speed: "fast"
  resource_footprint: "medium"
  startup_time_ms: 800
  parallel_overhead: "medium (manual orchestration)"

maintainability:
  page_object_support: "custom pattern"
  fixture_support: "via test framework (Jest/Mocha)"
  reusable_components: true
  built_in_reporting: false
  trace_viewer: "Chrome DevTools"
  debugging_tools: "good (DevTools Protocol)"

pip_packages: {}
install_commands: []
test_command: "npx jest"
report_paths:
  - "coverage/"

limitations:
  - "Chromium-only (no Firefox/WebKit native support)"
  - "JavaScript/TypeScript ONLY"
  - "Not a test framework (no assertions, runner)"
  - "Manual parallel execution setup"
  - "No built-in reporting"
  - "Being superseded by Playwright for new projects"
  - "Less active development since Playwright fork"
  - "No test retry or flaky test handling built-in"

versions:
  - version: "22.0"
    release_date: "2024-03-01"
    min_runtime: "Node 18+"
    notable_features:
      - "Firefox support (WebDriver BiDi)"
      - "Improved locator API"
      - "Automatic browser download management"
    capabilities_added:
      - name: "firefox_support"
        status: "added"
        description: "Firefox support via WebDriver BiDi protocol"
      - name: "locator_api"
        status: "added"
        description: "Playwright-style locator API for more resilient element selection"
    capabilities_deprecated:
      - name: "page_waitfor"
        status: "deprecated"
        description: "page.waitFor() removed"
        replacement: "page.waitForSelector() or page.waitForTimeout()"
    breaking_changes:
      - description: "Minimum Node.js version raised to 18"
        migration_effort: "low"
        affected_apis: []
        workaround: "Upgrade Node.js to 18+"
    known_limitations:
      - "Firefox BiDi support is still experimental"

  - version: "20.0"
    release_date: "2023-07-01"
    min_runtime: "Node 16+"
    notable_features:
      - "New headless mode (--headless=new)"
      - "Automatic browser management via @puppeteer/browsers"
    capabilities_added:
      - name: "new_headless_mode"
        status: "added"
        description: "Chrome's new headless mode (not old headless shell)"
      - name: "browser_management"
        status: "improved"
        description: "Automatic browser download and cache via @puppeteer/browsers"
    capabilities_deprecated:
      - name: "old_headless"
        status: "deprecated"
        description: "Old headless mode deprecated by Chrome team"
        replacement: "Use headless: 'new' option"
    breaking_changes:
      - description: "puppeteer.launch() default changed — downloads Chrome for Testing"
        migration_effort: "low"
        affected_apis: ["puppeteer.launch()", "PUPPETEER_CHROMIUM_REVISION"]
        workaround: "Set PUPPETEER_CACHE_DIR or use puppeteer.launch({channel: 'chrome'})"
    known_limitations:
      - "Browser download on first run may slow CI"

  - version: "15.0"
    release_date: "2022-07-01"
    eol_date: "2023-07-01"
    min_runtime: "Node 14+"
    notable_features:
      - "ESM support"
      - "New page.locator() API preview"
    capabilities_added:
      - name: "esm_support"
        status: "added"
        description: "ES module import support"
    capabilities_deprecated: []
    breaking_changes:
      - description: "Dropped Node 12 support"
        migration_effort: "low"
        affected_apis: []
        workaround: "Upgrade to Node 14+"
    known_limitations:
      - "page.locator() is experimental"

  - version: "10.0"
    release_date: "2021-07-01"
    eol_date: "2022-07-01"
    min_runtime: "Node 10+"
    notable_features:
      - "Improved TypeScript types"
      - "Element handle improvements"
    capabilities_added: []
    capabilities_deprecated: []
    breaking_changes:
      - description: "puppeteer-core split — must choose puppeteer or puppeteer-core explicitly"
        migration_effort: "low"
        affected_apis: ["require('puppeteer')"]
        workaround: "Use puppeteer (includes browser) or puppeteer-core (BYO browser)"
    known_limitations:
      - "Still Chromium-only"
