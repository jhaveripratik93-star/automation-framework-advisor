framework_name: "Pulumi"
vendor: "Pulumi Corporation"
license: "Apache-2.0"
website: "https://www.pulumi.com"
first_release: "2018"
latest_version: "3.x"
category: "cloud_infrastructure"
languages_supported:
  - Python
  - TypeScript
  - JavaScript
  - Go
  - "C#"
  - Java
  - YAML

architecture_fit:
  web_spa: false
  web_mpa: false
  native_mobile: false
  hybrid_mobile: false
  desktop: false
  api_testing: false
  microservices: false
  cloud_infrastructure: true
  infrastructure_as_code: true
  multi_cloud: true
  hybrid_cloud: true

capabilities:
  shadow_dom: false
  iframe_cross_origin: false
  multi_tab: false
  multi_domain: false
  canvas_webgl: false
  file_upload_download: false
  network_interception: false
  visual_regression: false
  parallel_execution: "native (dependency graph)"
  auto_wait: false
  test_recorder: false
  code_generation: "pulumi import, pulumi convert"
  component_testing: "unit testing with standard test frameworks"
  accessibility_testing: false
  state_management: true
  drift_detection: "pulumi refresh"
  real_programming_languages: true
  policy_as_code: "Pulumi CrossGuard (OPA-based)"
  secrets_management: "built-in (encrypted in state)"
  automation_api: "programmatic infrastructure deployment"

cloud_providers:
  aws: true
  azure: true
  gcp: true
  kubernetes: true
  digital_ocean: true
  oracle_cloud: true
  cloudflare: true
  docker: true

testing_capabilities:
  unit_testing: "native language test frameworks (pytest, jest, go test)"
  integration_testing: "pulumi testing framework (preview + assert)"
  compliance_testing: "CrossGuard policies"
  property_testing: "policy packs with assertions"
  mock_providers: "pulumi.runtime.mocks"
  snapshot_testing: "stack export comparison"

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: true
  pulumi_cloud: true

cloud_grids:
  pulumi_cloud: true
  self_hosted: true

performance:
  avg_test_execution_speed: "moderate (depends on provider API)"
  resource_footprint: "low-medium"
  startup_time_ms: 1000
  parallel_overhead: "low (DAG parallelism)"

maintainability:
  page_object_support: false
  fixture_support: "component resources, stack references"
  reusable_components: "component resources + packages"
  built_in_reporting: "Pulumi Cloud dashboards"
  trace_viewer: false
  debugging_tools: "standard IDE debugging (real languages)"
  package_registry: true

cloud_migration_metrics:
  resource_coverage: "% of cloud resources under IaC management"
  drift_detection_rate: "% of drift caught via pulumi refresh"
  deployment_frequency: "Stack updates per day/week"
  mean_time_to_recovery: "Time to pulumi up after failure"
  change_failure_rate: "% of updates that fail or rollback"
  infrastructure_cost_visibility: "via Pulumi Cloud"
  compliance_score: "% passing CrossGuard policies"
  code_reuse_ratio: "% of infra using shared components"
  type_safety_coverage: "Compile-time errors caught"

pip_packages:
  pulumi: ">=3.0"
install_commands: []
test_command: "pulumi up --yes"
report_paths:
  - "pulumi-results/"

limitations:
  - "NOT a test automation framework for applications"
  - "Smaller provider ecosystem than Terraform"
  - "State management tied to Pulumi Cloud or self-managed backends"
  - "Import from existing infrastructure is partial"
  - "Less community content/tutorials than Terraform"
  - "Runtime SDK overhead compared to declarative HCL"
  - "Cannot test application behavior, only infrastructure code"

versions:
  - version: "3.100"
    release_date: "2024-01-15"
    min_runtime: "Node 18+ / Python 3.8+ / Go 1.21+ / .NET 6+"
    notable_features:
      - "Improved pulumi import"
      - "Better state migration tools"
      - "Transforms (resource transforms at deploy time)"
    capabilities_added:
      - name: "resource_transforms"
        status: "added"
        description: "Transform resource properties at deploy time via code hooks"
      - name: "improved_import"
        status: "improved"
        description: "Import generates complete code for more resource types"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "Transforms API is still stabilizing"

  - version: "3.0"
    release_date: "2022-04-01"
    min_runtime: "Node 14+ / Python 3.7+ / Go 1.17+ / .NET 6+"
    notable_features:
      - "Automation API GA"
      - "Multi-language component support"
      - "Improved Go SDK"
    capabilities_added:
      - name: "automation_api_ga"
        status: "improved"
        description: "Automation API (programmatic deployment) is now GA"
      - name: "multi_lang_components"
        status: "added"
        description: "Write components in one language, consume from any other"
    capabilities_deprecated:
      - name: "pulumi_v2_sdk"
        status: "deprecated"
        description: "Pulumi 2.x SDK deprecated"
        replacement: "Pulumi 3.x SDK (breaking type changes)"
    breaking_changes:
      - description: "SDK type system changes — some resource inputs/outputs changed"
        migration_effort: "medium"
        affected_apis: ["Resource input/output types", "Provider SDK constructors"]
        workaround: "Follow per-provider migration guide and update type annotations"
      - description: "Python SDK requires explicit output.apply() for some operations"
        migration_effort: "low"
        affected_apis: ["Output[T] chaining"]
        workaround: "Use .apply(lambda) or Output.all() for multi-output operations"
    known_limitations:
      - "Not all Terraform providers have Pulumi equivalents"

  - version: "2.0"
    release_date: "2020-04-20"
    eol_date: "2022-10-01"
    min_runtime: "Node 10+ / Python 3.6+ / Go 1.14+ / .NET Core 3.1+"
    notable_features:
      - "Policy as Code (CrossGuard)"
      - "Go SDK GA"
      - "Improved .NET support"
    capabilities_added:
      - name: "crossguard"
        status: "added"
        description: "Policy as Code framework for compliance guardrails"
      - name: "go_sdk_ga"
        status: "added"
        description: "Go SDK reached GA stability"
      - name: "dotnet_support"
        status: "improved"
        description: ".NET SDK improved with better type support"
    capabilities_deprecated: []
    breaking_changes:
      - description: "Pulumi 1.x state format not forward-compatible"
        migration_effort: "low"
        affected_apis: ["pulumi stack"]
        workaround: "Run pulumi up once to auto-upgrade state format"
    known_limitations:
      - "Fewer providers than Terraform ecosystem"
