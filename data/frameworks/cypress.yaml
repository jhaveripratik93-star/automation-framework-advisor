framework_name: "Cypress"
vendor: "Cypress.io (acquired by Netlify)"
license: "MIT"
website: "https://www.cypress.io"
first_release: "2017"
latest_version: "13.x"
languages_supported:
  - JavaScript
  - TypeScript

architecture_fit:
  web_spa: true
  web_mpa: "limited"
  native_mobile: false
  hybrid_mobile: false
  desktop: false
  api_testing: true
  microservices: "partial"

capabilities:
  shadow_dom: true
  iframe_cross_origin: "limited (workarounds needed)"
  multi_tab: false
  multi_domain: "limited (cy.origin in v12+)"
  canvas_webgl: "limited"
  file_upload_download: true
  network_interception: true
  visual_regression: "plugin (cypress-image-snapshot)"
  parallel_execution: "Cypress Cloud (paid) or third-party"
  auto_wait: true
  test_recorder: "Cypress Studio (deprecated)"
  code_generation: false
  component_testing: true
  accessibility_testing: "plugin (cypress-axe)"

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: true

cloud_grids:
  browserstack: "limited"
  sauce_labs: "limited"
  cypress_cloud: true

performance:
  avg_test_execution_speed: "fast"
  resource_footprint: "medium-high"
  startup_time_ms: 3000
  parallel_overhead: "high (requires paid Cloud or orchestration)"

maintainability:
  page_object_support: "custom pattern (not enforced)"
  fixture_support: true
  reusable_components: true
  built_in_reporting: "basic (dashboard in Cloud)"
  trace_viewer: false
  debugging_tools: "excellent (time-travel)"

limitations:
  - "JavaScript/TypeScript ONLY - no Python/Java support"
  - "Single browser tab execution model"
  - "Cross-origin iFrame support is limited"
  - "No multi-tab or multi-window support"
  - "Parallel execution requires paid Cypress Cloud or workarounds"
  - "Cannot test native mobile applications"
  - "Limited browser support (no WebKit/Safari in free tier)"
  - "Test isolation can be challenging for complex workflows"
  - "Large dependency footprint"

versions:
  - version: "13.0"
    release_date: "2023-09-13"
    min_runtime: "Node 18+"
    notable_features:
      - "Retry-ability improvements"
      - "Full TypeScript support by default"
      - "Test isolation enabled by default"
    capabilities_added:
      - name: "test_isolation_default"
        status: "improved"
        description: "Test isolation enabled by default for cleaner state between tests"
      - name: "full_typescript_support"
        status: "improved"
        description: "TypeScript configuration auto-detected without manual setup"
    capabilities_deprecated: []
    breaking_changes:
      - description: "Node 16 and below no longer supported"
        migration_effort: "low"
        affected_apis: []
        workaround: "Upgrade Node.js to 18+"
      - description: "Test isolation enabled by default — tests sharing state will fail"
        migration_effort: "medium"
        affected_apis: ["cy.session", "Cypress.Cookies.preserveOnce"]
        workaround: "Set testIsolation: false in cypress.config or refactor tests to be independent"
      - description: "Cypress.Cookies.preserveOnce removed"
        migration_effort: "medium"
        affected_apis: ["Cypress.Cookies.preserveOnce"]
        workaround: "Use cy.session() API for cookie/session management"
    known_limitations:
      - "Still no multi-tab support"

  - version: "12.0"
    release_date: "2022-12-06"
    min_runtime: "Node 14+"
    notable_features:
      - "cy.origin() for cross-origin testing"
      - "Component testing GA"
      - "Test isolation option"
    capabilities_added:
      - name: "cy_origin"
        status: "added"
        description: "Cross-origin testing via cy.origin() without workarounds"
      - name: "component_testing"
        status: "added"
        description: "Component testing for React, Vue, Angular, Svelte (GA)"
      - name: "test_isolation"
        status: "added"
        description: "Test isolation option to clear state between tests"
    capabilities_deprecated:
      - name: "cy_intercept_legacy"
        status: "deprecated"
        description: "cy.route() and cy.server() fully removed"
        replacement: "cy.intercept()"
      - name: "cypress_cookies_defaults"
        status: "deprecated"
        description: "Cypress.Cookies.defaults() deprecated"
        replacement: "cy.session()"
    breaking_changes:
      - description: "cy.route() and cy.server() removed"
        migration_effort: "medium"
        affected_apis: ["cy.route", "cy.server"]
        workaround: "Replace with cy.intercept() for network stubbing"
    known_limitations:
      - "cy.origin() has performance overhead"
      - "Component testing requires framework-specific adapters"

  - version: "10.0"
    release_date: "2022-06-01"
    min_runtime: "Node 14+"
    notable_features:
      - "Cypress App redesign"
      - "Component testing beta"
      - "cy.session() for auth caching"
    capabilities_added:
      - name: "cy_session"
        status: "added"
        description: "Session caching for faster auth setup across tests"
      - name: "component_testing_beta"
        status: "added"
        description: "Component testing (beta) for mounting components in isolation"
    capabilities_deprecated:
      - name: "cypress_open_integration"
        status: "removed"
        description: "integrationFolder config option removed"
        replacement: "e2e.specPattern in cypress.config"
      - name: "plugins_file"
        status: "removed"
        description: "plugins/index.js file no longer used"
        replacement: "setupNodeEvents in cypress.config.ts"
    breaking_changes:
      - description: "cypress.json replaced by cypress.config.ts/js"
        migration_effort: "medium"
        affected_apis: ["cypress.json", "pluginsFile", "integrationFolder"]
        workaround: "Run npx cypress open to auto-migrate config, or manually create cypress.config.ts"
      - description: "plugins/index.js removed — use setupNodeEvents"
        migration_effort: "medium"
        affected_apis: ["plugins/index.js", "module.exports"]
        workaround: "Move plugin code into setupNodeEvents() in cypress.config.ts"
    known_limitations:
      - "Component testing is beta — API may change"
      - "Migration from v9 requires config file restructuring"

  - version: "9.0"
    release_date: "2021-11-24"
    min_runtime: "Node 12+"
    notable_features:
      - "cy.intercept() improvements"
      - "Improved TypeScript support"
      - "Cypress Studio (experimental)"
    capabilities_added:
      - name: "cypress_studio"
        status: "added"
        description: "Record tests interactively via Cypress Studio (experimental)"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "Cypress Studio is experimental and later deprecated"
      - "No cross-origin support yet"
