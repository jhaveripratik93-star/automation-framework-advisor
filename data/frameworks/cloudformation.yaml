framework_name: "AWS CloudFormation"
vendor: "Amazon Web Services"
license: "Proprietary (free service)"
website: "https://aws.amazon.com/cloudformation/"
first_release: "2011"
latest_version: "latest (managed service)"
category: "cloud_infrastructure"
languages_supported:
  - "JSON (templates)"
  - "YAML (templates)"
  - "Python (via AWS CDK)"
  - "TypeScript (via AWS CDK)"
  - "Java (via AWS CDK)"
  - "C# (via AWS CDK)"
  - "Go (via AWS CDK)"

architecture_fit:
  web_spa: false
  web_mpa: false
  native_mobile: false
  hybrid_mobile: false
  desktop: false
  api_testing: false
  microservices: false
  cloud_infrastructure: true
  infrastructure_as_code: true
  multi_cloud: false
  hybrid_cloud: "partial (via custom resources)"
  aws_native: true

capabilities:
  shadow_dom: false
  iframe_cross_origin: false
  multi_tab: false
  multi_domain: false
  canvas_webgl: false
  file_upload_download: false
  network_interception: false
  visual_regression: false
  parallel_execution: "native (dependency-based)"
  auto_wait: "built-in (waits for resource creation)"
  test_recorder: false
  code_generation: "CloudFormation IaC Generator, CDK synth"
  component_testing: "cfn-lint, taskcat"
  accessibility_testing: false
  state_management: "managed by AWS (stack state)"
  drift_detection: "native (detect stack drift)"
  rollback: "automatic on failure"
  change_sets: "preview changes before apply"
  stacksets: "multi-account/multi-region deployment"
  nested_stacks: true
  custom_resources: "Lambda-backed extensions"

cloud_providers:
  aws: true
  azure: false
  gcp: false
  kubernetes: "partial (EKS integration)"

testing_capabilities:
  unit_testing: "CDK assertions library"
  integration_testing: "taskcat (multi-region deployment testing)"
  compliance_testing: "cfn-guard (policy-as-code), AWS Config rules"
  template_validation: "aws cloudformation validate-template"
  linting: "cfn-lint"
  drift_detection: "native CloudFormation drift detection"
  contract_testing: "resource type schema validation"

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: "AWS CLI images"
  aws_codepipeline: true
  aws_codebuild: true

cloud_grids:
  aws_native: true
  cloudformation_registry: true

performance:
  avg_test_execution_speed: "slow (API-dependent, sequential resources)"
  resource_footprint: "none (managed service)"
  startup_time_ms: 0
  parallel_overhead: "managed by AWS"
  stack_limit: "500 resources per stack"

maintainability:
  page_object_support: false
  fixture_support: "nested stacks, modules (CDK constructs)"
  reusable_components: "CDK constructs, CloudFormation modules"
  built_in_reporting: "CloudFormation console, CloudTrail"
  trace_viewer: false
  debugging_tools: "stack events, CloudWatch logs"
  construct_library: "AWS CDK Construct Hub"

cloud_migration_metrics:
  resource_coverage: "% of AWS resources in CloudFormation stacks"
  stack_health: "% of stacks in CREATE_COMPLETE/UPDATE_COMPLETE"
  drift_percentage: "% of resources drifted from template"
  deployment_frequency: "Stack updates per day/week"
  mean_time_to_recovery: "Time to rollback/re-deploy"
  change_failure_rate: "% of stack updates that rollback"
  compliance_score: "% passing cfn-guard rules"
  multi_account_coverage: "% of accounts using StackSets"
  cost_allocation: "Tagged resource percentage"

pip_packages: {}
install_commands: []
test_command: "aws cloudformation deploy --template-file template.yaml --stack-name my-stack"
report_paths:
  - "cfn-results/"

limitations:
  - "NOT a test automation framework for applications"
  - "500 resource limit per stack"
  - "Slow deployments (sequential by default)"
  - "Complex YAML/JSON syntax without CDK"
  - "Limited refactoring (resource replacement risks)"
  - "Rollback can be slow and sometimes gets stuck"
  - "Custom resources add Lambda dependency"
  - "No import for all resource types"
  - "Cannot test application behavior, only infrastructure"
  - "Vendor lock-in to AWS"

versions:
  - version: "2023-12"
    release_date: "2023-12-01"
    min_runtime: "N/A (AWS managed service)"
    notable_features:
      - "Git sync for stacks"
      - "Improved IaC Generator"
      - "Stack-level tags"
    capabilities_added:
      - name: "git_sync"
        status: "added"
        description: "Auto-deploy stacks from Git repository changes"
      - name: "iac_generator_improved"
        status: "improved"
        description: "Generate CloudFormation templates from existing resources"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "IaC Generator doesn't support all resource types"

  - version: "2022-09"
    release_date: "2022-09-01"
    min_runtime: "N/A (AWS managed service)"
    notable_features:
      - "CloudFormation modules GA"
      - "Hooks (pre-provision validation)"
      - "Registry extensions"
    capabilities_added:
      - name: "cloudformation_hooks"
        status: "added"
        description: "Pre-provision hooks for custom validation before resource creation"
      - name: "modules_ga"
        status: "improved"
        description: "CloudFormation Modules reached GA — reusable template components"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "Hooks have performance overhead"
      - "Modules have limited nesting depth"

  - version: "2021-01"
    release_date: "2021-01-01"
    min_runtime: "N/A (AWS managed service)"
    notable_features:
      - "CloudFormation modules (preview)"
      - "AWS CDK v2 support"
      - "Improved drift detection"
    capabilities_added:
      - name: "cdk_v2"
        status: "added"
        description: "AWS CDK v2 with consolidated constructs package"
      - name: "modules_preview"
        status: "added"
        description: "Reusable template modules (preview)"
    capabilities_deprecated:
      - name: "cdk_v1"
        status: "deprecated"
        description: "AWS CDK v1 entering maintenance mode"
        replacement: "AWS CDK v2 (single @aws-cdk/aws-* → aws-cdk-lib)"
    breaking_changes:
      - description: "CDK v1 to v2 requires import changes"
        migration_effort: "medium"
        affected_apis: ["@aws-cdk/aws-s3", "@aws-cdk/aws-lambda", "all @aws-cdk/* packages"]
        workaround: "Replace all @aws-cdk/* imports with aws-cdk-lib: import { aws_s3 } from 'aws-cdk-lib'"
    known_limitations:
      - "CDK v1 to v2 migration requires updating all construct imports"

  - version: "2019-01"
    release_date: "2019-01-01"
    eol_date: "2021-06-01"
    min_runtime: "N/A (AWS managed service)"
    notable_features:
      - "StackSets for multi-account"
      - "Drift detection"
      - "Change sets"
    capabilities_added:
      - name: "drift_detection"
        status: "added"
        description: "Native drift detection for stack resources"
      - name: "stacksets"
        status: "improved"
        description: "Multi-account, multi-region deployments via StackSets"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "Drift detection doesn't cover all resource properties"
