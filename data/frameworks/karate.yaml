framework_name: "Karate"
vendor: "OpenSource (Karate Labs)"
license: "MIT"
website: "https://karatelabs.github.io/karate/"
first_release: "2017"
latest_version: "1.5+"
languages_supported:
  - "Karate DSL (Gherkin-like)"
  - "Java (for extensions)"

architecture_fit:
  web_spa: "via Karate UI (Playwright-based)"
  web_mpa: "via Karate UI"
  native_mobile: "via Appium driver"
  hybrid_mobile: "via Appium driver"
  desktop: "via Appium/WinAppDriver"
  api_testing: true
  microservices: true

capabilities:
  shadow_dom: "via Playwright engine"
  iframe_cross_origin: "via Playwright engine"
  multi_tab: "limited"
  multi_domain: true
  canvas_webgl: false
  file_upload_download: true
  network_interception: false
  visual_regression: false
  parallel_execution: "native"
  auto_wait: "partial"
  test_recorder: false
  code_generation: false
  component_testing: false
  accessibility_testing: false
  protocol_support:
    - HTTP/HTTPS
    - GraphQL
    - WebSocket
    - gRPC
    - SOAP

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: "community"

cloud_grids:
  browserstack: "limited"
  sauce_labs: "limited"

performance:
  avg_test_execution_speed: "fast (for API)"
  resource_footprint: "medium (JVM)"
  startup_time_ms: 3000
  parallel_overhead: "low"

maintainability:
  page_object_support: "feature file organization"
  fixture_support: "Background/hooks"
  reusable_components: "call/read features"
  built_in_reporting: true
  trace_viewer: false
  debugging_tools: "VS Code plugin"

limitations:
  - "JVM dependency (Java runtime required)"
  - "DSL has a learning curve"
  - "UI testing less mature than dedicated frameworks"
  - "Not suitable for teams without Java/JVM familiarity"
  - "Smaller community than Selenium/Playwright"
  - "IDE support limited to VS Code plugin"
  - "Not ideal for complex UI interaction scenarios"
  - "Performance testing capabilities are basic"

versions:
  - version: "1.5"
    release_date: "2024-01-10"
    min_runtime: "Java 11+"
    notable_features:
      - "Playwright engine for UI automation"
      - "Improved gRPC support"
      - "Better parallel execution"
    capabilities_added:
      - name: "playwright_engine"
        status: "improved"
        description: "Upgraded Playwright engine for better browser automation"
      - name: "grpc_improvements"
        status: "improved"
        description: "Enhanced gRPC testing with streaming support"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "Playwright engine version may lag behind standalone Playwright"

  - version: "1.4"
    release_date: "2023-06-01"
    min_runtime: "Java 11+"
    notable_features:
      - "Karate UI (Playwright-based)"
      - "Improved JSON schema validation"
      - "Enhanced retry mechanisms"
    capabilities_added:
      - name: "karate_ui"
        status: "added"
        description: "Browser automation via embedded Playwright engine"
      - name: "retry_mechanism"
        status: "improved"
        description: "Per-scenario retry with configurable attempts"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "UI automation less mature than dedicated Playwright"

  - version: "1.0"
    release_date: "2021-02-21"
    min_runtime: "Java 8+"
    notable_features:
      - "First stable major release"
      - "Standalone JAR execution"
      - "Built-in parallel execution"
      - "Gatling integration for performance"
    capabilities_added:
      - name: "standalone_jar"
        status: "added"
        description: "Run tests without Maven/Gradle via standalone JAR"
      - name: "gatling_integration"
        status: "added"
        description: "Performance testing via Gatling integration"
    capabilities_deprecated:
      - name: "karate_junit4"
        status: "deprecated"
        description: "JUnit4 runner deprecated"
        replacement: "JUnit5 runner (karate-junit5)"
    breaking_changes:
      - description: "JUnit4 runner removed as default"
        migration_effort: "low"
        affected_apis: ["karate-junit4", "@KarateOptions"]
        workaround: "Switch to karate-junit5 dependency and @Karate.Test annotation"
    known_limitations:
      - "No browser automation in 1.0 (added in 1.4)"

  - version: "0.9"
    release_date: "2020-01-15"
    eol_date: "2021-06-01"
    min_runtime: "Java 8+"
    notable_features:
      - "Final pre-1.0 release"
      - "Mock server support"
      - "GraphQL testing"
    capabilities_added:
      - name: "mock_server"
        status: "added"
        description: "Built-in mock server for service virtualization"
      - name: "graphql_testing"
        status: "added"
        description: "Native GraphQL query/mutation testing support"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "API may change before 1.0 GA"
