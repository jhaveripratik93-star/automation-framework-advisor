framework_name: "Locust"
vendor: "OpenSource"
license: "MIT"
website: "https://locust.io"
first_release: "2011"
latest_version: "2.x"
category: "test_automation"
languages_supported:
  - Python

architecture_fit:
  web_spa: false
  web_mpa: false
  native_mobile: false
  hybrid_mobile: false
  desktop: false
  api_testing: true
  microservices: true
  performance_testing: true
  load_testing: true
  cloud_infrastructure: false
  infrastructure_as_code: false
  multi_cloud: false
  hybrid_cloud: false

capabilities:
  shadow_dom: false
  iframe_cross_origin: false
  multi_tab: false
  multi_domain: false
  canvas_webgl: false
  file_upload_download: false
  network_interception: false
  visual_regression: false
  parallel_execution: "native (distributed workers)"
  auto_wait: false
  test_recorder: false
  code_generation: false
  component_testing: false
  accessibility_testing: false
  gesture_support: false
  device_farm_support: false
  protocol_support:
    - HTTP/HTTPS
    - WebSocket
    - "Custom protocols (via user classes)"
  schema_validation: false
  json_path_support: false
  xml_path_support: false
  drift_detection: false
  state_management: false
  plan_and_apply: false
  policy_as_code: false

cloud_providers:
  aws: false
  azure: false
  gcp: false
  kubernetes: true

testing_capabilities:
  unit_testing: false
  integration_testing: false
  e2e_testing: false
  component_testing: false
  visual_testing: false
  accessibility_testing: false
  api_testing: true
  performance_testing: true

cloud_migration_metrics:
  not_applicable: true

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: true
  terraform_cloud: false
  atlantis: false
  aws_codepipeline: false
  aws_codebuild: false

cloud_grids:
  standalone: true
  kubernetes: "native distributed mode"

performance:
  avg_test_execution_speed: "fast (gevent coroutines)"
  resource_footprint: "low"
  startup_time_ms: 500
  max_virtual_users: "10000+ per worker"
  distributed_execution: "native master/worker"

maintainability:
  page_object_support: false
  fixture_support: "Python classes"
  reusable_components: "Python inheritance"
  built_in_reporting: "web UI + CSV"
  trace_viewer: false
  debugging_tools: "Python debugging"
  grafana_integration: "via plugins"

pip_packages:
  locust: ">=2.0"
install_commands: []
test_command: "locust -f tests/load_test.py --headless -u 10 -r 2 --run-time 1m"
report_paths:
  - "locust-results.csv"

limitations:
  - "NOT a functional/UI test framework"
  - "Python only"
  - "No browser-based testing"
  - "Web UI is basic compared to commercial tools"
  - "No built-in distributed coordination (manual setup)"
  - "Less protocol support than K6 out of the box"
  - "Reporting requires external tools for enterprise use"
  - "No record-and-playback capability"

versions:
  - version: "2.24"
    release_date: "2024-02-01"
    min_runtime: "Python 3.8+"
    notable_features:
      - "Improved REST/FastHTTP client"
      - "Custom messages in assertions"
    capabilities_added:
      - name: "custom_messages"
        status: "improved"
        description: "Custom assertion messages for better failure reporting"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations: []

  - version: "2.0"
    release_date: "2022-03-15"
    min_runtime: "Python 3.7+"
    notable_features:
      - "Modern Python async with geventhttpclient"
      - "Improved web UI"
      - "Class-based users replace Locust/HttpLocust"
    capabilities_added:
      - name: "modern_web_ui"
        status: "improved"
        description: "Redesigned web UI with real-time charts"
      - name: "tag_support"
        status: "added"
        description: "Tag tasks for selective execution"
    capabilities_deprecated:
      - name: "locust_class"
        status: "removed"
        description: "Locust and HttpLocust base classes removed"
        replacement: "Use User and HttpUser base classes"
      - name: "task_set"
        status: "removed"
        description: "TaskSet class removed"
        replacement: "Use @task decorator directly on User class methods"
    breaking_changes:
      - description: "Locust/HttpLocust classes removed — use User/HttpUser"
        migration_effort: "medium"
        affected_apis: ["Locust", "HttpLocust", "TaskSet"]
        workaround: "Replace Locust with User, HttpLocust with HttpUser, and flatten TaskSets into @task methods"
      - description: "Python 3.6 no longer supported"
        migration_effort: "low"
        affected_apis: []
        workaround: "Upgrade to Python 3.7+"
    known_limitations:
      - "No backward compatibility with Locust 1.x scripts"

  - version: "1.0"
    release_date: "2020-06-01"
    eol_date: "2022-06-01"
    min_runtime: "Python 3.6+"
    notable_features:
      - "First stable release"
      - "Simplified API"
      - "Web UI for real-time monitoring"
    capabilities_added:
      - name: "simplified_api"
        status: "added"
        description: "HttpUser and @task decorator as primary API"
    capabilities_deprecated:
      - name: "locust_class"
        status: "deprecated"
        description: "Old Locust/HttpLocust classes deprecated"
        replacement: "User/HttpUser"
    breaking_changes: []
    known_limitations:
      - "Distributed mode requires manual worker setup"
