framework_name: "Terraform"
vendor: "HashiCorp"
license: "BSL-1.1 (source-available)"
website: "https://www.terraform.io"
first_release: "2014"
latest_version: "1.9+"
category: "cloud_infrastructure"
languages_supported:
  - "HCL (HashiCorp Configuration Language)"
  - "Python (via CDK for Terraform)"
  - "TypeScript (via CDK for Terraform)"
  - "Go (provider development)"

architecture_fit:
  web_spa: false
  web_mpa: false
  native_mobile: false
  hybrid_mobile: false
  desktop: false
  api_testing: false
  microservices: false
  cloud_infrastructure: true
  infrastructure_as_code: true
  multi_cloud: true
  hybrid_cloud: true

capabilities:
  shadow_dom: false
  iframe_cross_origin: false
  multi_tab: false
  multi_domain: false
  canvas_webgl: false
  file_upload_download: false
  network_interception: false
  visual_regression: false
  parallel_execution: "native (resource graph parallelism)"
  auto_wait: false
  test_recorder: false
  code_generation: "terraform import, terraform plan"
  component_testing: "terraform test (native)"
  accessibility_testing: false
  state_management: true
  drift_detection: true
  plan_and_apply: true
  module_registry: true
  provider_ecosystem: "2000+ providers"
  policy_as_code: "Sentinel / OPA"

cloud_providers:
  aws: true
  azure: true
  gcp: true
  oracle_cloud: true
  alibaba_cloud: true
  ibm_cloud: true
  digital_ocean: true
  kubernetes: true
  openstack: true

testing_capabilities:
  unit_testing: "terraform test (HCL-native)"
  integration_testing: "terratest (Go-based)"
  compliance_testing: "Sentinel, OPA, Checkov, tfsec"
  plan_validation: "terraform plan + assertions"
  mock_providers: "terraform test mocks"
  contract_testing: "module input/output validation"

cicd_integration:
  docker_support: true
  github_actions: true
  jenkins: true
  gitlab_ci: true
  azure_devops: true
  pre_built_docker_images: true
  terraform_cloud: true
  atlantis: true

cloud_grids:
  terraform_cloud: true
  terraform_enterprise: true
  spacelift: true
  env0: true
  scalr: true

performance:
  avg_test_execution_speed: "moderate (depends on provider API)"
  resource_footprint: "low (CLI tool)"
  startup_time_ms: 500
  parallel_overhead: "low (DAG-based parallelism)"
  state_lock: true

maintainability:
  page_object_support: false
  fixture_support: "modules and workspaces"
  reusable_components: "modules (public + private registry)"
  built_in_reporting: "plan output, state inspection"
  trace_viewer: false
  debugging_tools: "TF_LOG, terraform console"
  module_versioning: true
  state_backends: "S3, Azure Blob, GCS, Consul, Terraform Cloud"

cloud_migration_metrics:
  resource_coverage: "% of infrastructure resources managed"
  drift_detection_rate: "% of drift caught before manual changes"
  deployment_frequency: "Deployments per day/week"
  mean_time_to_recovery: "Time to restore from failed apply"
  change_failure_rate: "% of applies that cause incidents"
  infrastructure_cost_visibility: true
  compliance_score: "% of resources passing policy checks"
  blast_radius_analysis: "Impact scope of plan changes"

limitations:
  - "NOT a test automation framework for applications"
  - "HCL has a learning curve for developers"
  - "State management complexity (locking, drift)"
  - "BSL license change may concern some organizations"
  - "Slow feedback for large infrastructure (API rate limits)"
  - "Provider version compatibility issues"
  - "Destroy operations are irreversible and dangerous"
  - "Limited refactoring support (state moves are manual)"
  - "No built-in secret management (needs Vault integration)"
  - "Cannot test application behavior, only infrastructure provisioning"

versions:
  - version: "1.9"
    release_date: "2024-06-26"
    min_runtime: "N/A (standalone binary)"
    notable_features:
      - "Input validation via variables"
      - "Improved terraform test"
      - "Override files improvements"
    capabilities_added:
      - name: "variable_validation_improved"
        status: "improved"
        description: "Cross-variable validation rules and complex condition expressions"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "BSL license applies"

  - version: "1.6"
    release_date: "2023-10-04"
    min_runtime: "N/A (standalone binary)"
    notable_features:
      - "terraform test (native testing framework)"
      - "Config-driven import"
      - "S3 state backend native locking"
    capabilities_added:
      - name: "terraform_test"
        status: "added"
        description: "Native HCL-based testing framework — write tests in .tftest.hcl files"
      - name: "config_driven_import"
        status: "added"
        description: "Import existing resources via import blocks (no state surgery)"
    capabilities_deprecated:
      - name: "terraform_import_cli"
        status: "deprecated"
        description: "terraform import CLI deprecated for new workflows"
        replacement: "import {} block in configuration"
    breaking_changes: []
    known_limitations:
      - "terraform test cannot mock all providers yet"

  - version: "1.5"
    release_date: "2023-06-12"
    min_runtime: "N/A (standalone binary)"
    notable_features:
      - "License change to BSL-1.1"
      - "import block (preview)"
      - "check block for custom validations"
    capabilities_added:
      - name: "check_block"
        status: "added"
        description: "Post-apply validation assertions via check {} blocks"
      - name: "import_block"
        status: "added"
        description: "Declarative resource import (preview)"
    capabilities_deprecated: []
    breaking_changes:
      - description: "License changed from MPL-2.0 to BSL-1.1"
        migration_effort: "low"
        affected_apis: []
        workaround: "Evaluate BSL terms. For MPL alternative, consider OpenTofu fork"
    known_limitations:
      - "BSL restricts competitive use"
      - "Some enterprise customers may need legal review"

  - version: "1.0"
    release_date: "2021-06-08"
    min_runtime: "N/A (standalone binary)"
    notable_features:
      - "First stable 1.x release"
      - "Compatibility promises (no breaking changes until 2.0)"
      - "Improved plan output"
    capabilities_added: []
    capabilities_deprecated:
      - name: "terraform_012_syntax"
        status: "removed"
        description: "Terraform 0.11 and 0.12 legacy HCL syntax removed"
        replacement: "HCL2 syntax (Terraform 0.13+)"
    breaking_changes:
      - description: "terraform 0.x state files require migration"
        migration_effort: "medium"
        affected_apis: ["terraform state"]
        workaround: "Run terraform init to upgrade state format"
    known_limitations:
      - "Large state files can be slow to plan"

  - version: "0.14"
    release_date: "2020-12-02"
    eol_date: "2022-01-01"
    min_runtime: "N/A (standalone binary)"
    notable_features:
      - "Provider dependency lock file"
      - "Sensitive output marking"
    capabilities_added:
      - name: "dependency_lock_file"
        status: "added"
        description: ".terraform.lock.hcl for reproducible provider versions"
      - name: "sensitive_outputs"
        status: "added"
        description: "Mark outputs as sensitive to hide in plan/apply output"
    capabilities_deprecated: []
    breaking_changes: []
    known_limitations:
      - "Lock file must be committed to VCS"
